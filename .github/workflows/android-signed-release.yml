name: Publicar APK Android firmado
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.3); debe coincidir con configure_android.py'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar secretos de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo 'Faltan secretos de firma Android'; exit 1; }
      - name: Preparar Capacitor
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 configure_android.py
      - name: Validar versión solicitada
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          version=os.environ['VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+(\.[0-9]+)?',version), 'Versión inválida'
          gradle=pathlib.Path('native/android/android/app/build.gradle').read_text()
          assert re.search(r'versionName\s+["\']'+re.escape(version)+r'["\']',gradle), 'Versión solicitada no coincide con APK'
          PY
      - name: Compilar APK release
        working-directory: native/android/android
        run: bash gradlew assembleRelease --no-daemon --max-workers=2
      - name: Firmar y verificar APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          APK=native/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "FleboReport-${{ inputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "FleboReport-${{ inputs.version }}.apk"
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "android-v$VERSION" "FleboReport-$VERSION.apk" --title "FleboReport Android $VERSION" --notes "APK Android firmado. Instalar sobre versiones con la misma firma. No desinstalar la aplicación anterior." --verify-tag
