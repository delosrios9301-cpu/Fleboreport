name: Publicar APK Android firmado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-signed-release.yml'
      - 'native/android/configure_android.py'
      - 'native/android/FleboIdScannerPlugin.java'
      - 'native/android/FleboQrCameraActivity.java'
      - 'native/android/MainActivity.java'
      - 'native/android/package.json'
      - 'native/android/capacitor.config.json'
      - 'cedula-ocr.js'
      - 'android-update-notice.js'
  workflow_dispatch:
    inputs:
      version:
        description: 'Opcional: versión que debe coincidir con configure_android.py'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: fleboreport-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Determinar versión y comprobar publicación existente
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/version.txt"
          import pathlib, re
          s=pathlib.Path('native/android/configure_android.py').read_text()
          names=re.findall(r'versionName "([0-9]+\.[0-9]+(?:\.[0-9]+)?)"',s)
          codes=re.findall(r'versionCode ([0-9]+)',s)
          assert len(names)>=2 and len(codes)>=2, 'No se pudo identificar la versión de Android'
          assert int(codes[-1])>3, 'versionCode debe ser superior al de Android 1.2'
          print(names[-1])
          print(codes[-1])
          PY
          VERSION="$(sed -n '1p' "$RUNNER_TEMP/version.txt")"
          CODE="$(sed -n '2p' "$RUNNER_TEMP/version.txt")"
          if [ -n "$REQUESTED_VERSION" ] && [ "$REQUESTED_VERSION" != "$VERSION" ]; then
            echo "::error::La versión solicitada no coincide con configure_android.py: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          TAG="android-v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt" 2>/dev/null; then
            if grep -Fxq "FleboReport-$VERSION.apk" "$RUNNER_TEMP/release-assets.txt"; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "La versión $VERSION ya está publicada."
            else
              echo "::error::El release $TAG existe sin el APK previsto; revisar manualmente."
              exit 1
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Preparando publicación de Android $VERSION (código $CODE)."
          fi
      - name: Comprobar firma permanente
        if: steps.info.outputs.publish == 'true'
        env:
          BACKUP_PASSWORD: ${{ secrets.ANDROID_SIGNING_BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD" || { echo "::error::Falta ANDROID_SIGNING_BACKUP_PASSWORD"; exit 1; }
          test -s native/android/signing/fleboreport-release.jks.enc || { echo "::error::Falta el respaldo cifrado del keystore"; exit 1; }
      - name: Preparar Capacitor
        if: steps.info.outputs.publish == 'true'
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 configure_android.py
      - name: Validar versión compilada
        if: steps.info.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          CODE: ${{ steps.info.outputs.version_code }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          gradle=pathlib.Path('native/android/android/app/build.gradle').read_text()
          assert ('versionName "'+os.environ['VERSION']+'"') in gradle, 'versionName incorrecta'
          assert ('versionCode '+os.environ['CODE']) in gradle, 'versionCode incorrecto'
          PY
      - name: Compilar APK
        if: steps.info.outputs.publish == 'true'
        working-directory: native/android/android
        run: bash gradlew assembleRelease --no-daemon --max-workers=2
      - name: Firmar APK y comprobar certificado de Android 1.3
        if: steps.info.outputs.publish == 'true'
        env:
          BACKUP_PASSWORD: ${{ secrets.ANDROID_SIGNING_BACKUP_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.FLEBO_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FLEBO_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLEBO_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLEBO_ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.info.outputs.version }}
          CODE: ${{ steps.info.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in native/android/signing/fleboreport-release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass stdin
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          STORE_PASS="$(printf '%s' "$BACKUP_PASSWORD" | openssl dgst -sha256 -binary | xxd -p -c 256)"
          export STORE_PASS
          APK=native/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias fleboreport --ks-pass env:STORE_PASS --key-pass env:STORE_PASS --out "FleboReport-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose --print-certs "FleboReport-$VERSION.apk" > "$RUNNER_TEMP/new-signature.txt"
          "$BUILD_TOOLS/aapt" dump badging "FleboReport-$VERSION.apk" > "$RUNNER_TEMP/package.txt"
          grep -F "name='com.fleboreport.app'" "$RUNNER_TEMP/package.txt"
          grep -F "versionCode='$CODE'" "$RUNNER_TEMP/package.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          mkdir -p "$RUNNER_TEMP/previous"
          # La versión 1.3 es la versión base instalada. Su certificado prevalece.
          # Las APK 1.2 y 1.3 tienen firmas diferentes: exigir coincidencia con 1.2
          # impediría actualizar 1.3 y, peor, no garantiza compatibilidad con 1.3.
          gh release download android-v1.3 --repo "$GITHUB_REPOSITORY" --pattern FleboReport-1.3.apk --dir "$RUNNER_TEMP/previous"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/previous/FleboReport-1.3.apk" > "$RUNNER_TEMP/previous-signature.txt"
          # La salida de apksigner puede incluir espacios/variaciones: extraer huella
          # con regex explícita y verificar que sean 64 caracteres hexadecimales.
          extract_sha256_cert() {
            python3 - "$1" <<'PY'
          import pathlib, re, sys
          p=pathlib.Path(sys.argv[1])
          data=p.read_text(errors='replace')
          match=re.search(r'(?im)^\s*Signer\s*#?1\s+certificate\s+SHA[- ]?256\s+digest\s*:\s*([0-9a-f:]{64,95})', data)
          if not match:
              lines=[line.split(':')[0][:100] for line in data.splitlines() if 'certificate' in line.lower() or 'signer' in line.lower() or 'SHA' in line]
              print(f"No se identificó huella en {p.name}. Etiquetas: {lines[:8]}",file=sys.stderr)
              sys.exit(1)
          fingerprint=match.group(1).replace(':','').lower()
          if not re.fullmatch(r'[0-9a-f]{64}',fingerprint):
              sys.exit('Huella SHA-256 incompleta')
          print(fingerprint)
          PY
          }
          OLD_CERT="$(extract_sha256_cert "$RUNNER_TEMP/previous-signature.txt")"
          NEW_CERT="$(extract_sha256_cert "$RUNNER_TEMP/new-signature.txt")"
          # El respaldo cifrado puede no corresponder al certificado instalado. Probar la
          # clave de producción histórica, si está configurada, sin desactivar la verificación.
          if [ "$OLD_CERT" != "$NEW_CERT" ]; then
            echo "El respaldo de firma no coincide con Android instalado; comprobando clave de producción histórica."
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::No está disponible la clave de firma compatible. Configura los secretos FLEBO_ANDROID_KEYSTORE_BASE64, FLEBO_ANDROID_KEYSTORE_PASSWORD, FLEBO_ANDROID_KEY_ALIAS y FLEBO_ANDROID_KEY_PASSWORD. No publicar."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/production.jks"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/production.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "FleboReport-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" verify --verbose --print-certs "FleboReport-$VERSION.apk" > "$RUNNER_TEMP/new-signature.txt"
            NEW_CERT="$(extract_sha256_cert "$RUNNER_TEMP/new-signature.txt")"
            rm -f "$RUNNER_TEMP/production.jks"
          fi
          test -n "$NEW_CERT" && test "$OLD_CERT" = "$NEW_CERT" || { echo "::error::La firma no coincide con Android 1.3 instalado. No publicar."; exit 1; }
          echo "Firma y versión verificadas; APK compatible con Android 1.3."
      - name: Publicar GitHub Release automáticamente
        if: steps.info.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.info.outputs.version }}
          CODE: ${{ steps.info.outputs.version_code }}
        run: |
          gh release create "android-v$VERSION" "FleboReport-$VERSION.apk" --repo "$GITHUB_REPOSITORY" --title "FleboReport Android $VERSION" --notes "APK Android firmado (versionCode $CODE). Firma comprobada contra FleboReport 1.3. Instalar encima de la anterior con confirmación de Android."
