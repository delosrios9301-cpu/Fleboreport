name: Publicar APK Android firmado
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej. 1.3); debe coincidir con configure_android.py'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar respaldo cifrado de firma
        env:
          BACKUP_PASSWORD: ${{ secrets.ANDROID_SIGNING_BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD" || { echo "::error::Falta ANDROID_SIGNING_BACKUP_PASSWORD"; exit 1; }
          test -s native/android/signing/fleboreport-release.jks.enc || { echo "::error::Ejecuta primero Preparar firma Android desde celular"; exit 1; }
      - name: Preparar Capacitor
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          python3 configure_android.py
      - name: Validar versión solicitada
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os,re,pathlib
          version=os.environ['VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+(\.[0-9]+)?',version), 'Versión inválida'
          gradle=pathlib.Path('native/android/android/app/build.gradle').read_text()
          assert ('versionName "'+version+'"') in gradle, 'Versión solicitada no coincide con APK'
          PY
      - name: Compilar APK release
        working-directory: native/android/android
        run: bash gradlew assembleRelease --no-daemon --max-workers=2
      - name: Descifrar, firmar y verificar APK
        env:
          BACKUP_PASSWORD: ${{ secrets.ANDROID_SIGNING_BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$BACKUP_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 -in native/android/signing/fleboreport-release.jks.enc -out "$RUNNER_TEMP/release.jks" -pass stdin
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          STORE_PASS="$(printf '%s' "$BACKUP_PASSWORD" | openssl dgst -sha256 -binary | xxd -p -c 256)"
          export STORE_PASS
          APK=native/android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$ZIPALIGN" && test -x "$APKSIGNER"
          "$ZIPALIGN" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias fleboreport --ks-pass env:STORE_PASS --key-pass env:STORE_PASS --out "FleboReport-${{ inputs.version }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$APKSIGNER" verify --verbose "FleboReport-${{ inputs.version }}.apk"
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "android-v$VERSION" "FleboReport-$VERSION.apk" --title "FleboReport Android $VERSION" --notes "APK Android firmado. Instalar sobre versiones con la misma firma. No desinstalar la aplicación anterior."
