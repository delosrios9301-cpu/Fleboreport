name: Android ML Kit APK (manual)
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - 'cedula-ocr.js'
      - 'tests/cedula-qr-parser.test.mjs'
      - '.github/workflows/android-mlkit-apk.yml'
  pull_request:
    paths:
      - 'native/android/**'
      - 'cedula-ocr.js'
      - 'tests/cedula-qr-parser.test.mjs'
      - '.github/workflows/android-mlkit-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar lector y parser QR con datos sintéticos
        run: |
          node --check cedula-ocr.js
          node tests/cedula-qr-parser.test.mjs
      - name: Comprobar SDK Android preinstalado
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Instalar Capacitor
        working-directory: native/android
        run: npm install --no-audit --no-fund
      - name: Generar proyecto Android
        working-directory: native/android
        run: npx cap add android
      - name: Configurar ML Kit
        working-directory: native/android
        run: python3 configure_android.py
      - name: Compilar APK de prueba
        working-directory: native/android/android
        run: bash gradlew assembleDebug --no-daemon --max-workers=2
      - name: Publicar APK de prueba como artefacto privado de Actions
        uses: actions/upload-artifact@v4
        with:
          name: fleboreport-android-mlkit-debug
          path: native/android/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
