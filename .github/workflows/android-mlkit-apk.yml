name: Android ML Kit APK (manual)
on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/**'
      - 'cedula-ocr.js'
      - 'tests/cedula-qr-parser.test.mjs'
      - '.github/workflows/android-mlkit-apk.yml'
  pull_request:
    paths:
      - 'native/android/**'
      - 'cedula-ocr.js'
      - 'tests/cedula-qr-parser.test.mjs'
      - '.github/workflows/android-mlkit-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validar lector y parser QR con datos sintéticos
        run: |
          node --check cedula-ocr.js
          node tests/cedula-qr-parser.test.mjs
      - name: Comprobar SDK Android preinstalado
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      - name: Instalar Capacitor y dependencias de empaquetado OTA
        run: npm install --no-save @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - name: Preparar recursos web reales
        run: node scripts/prepare-android-web.mjs
      - name: Generar proyecto Android
        run: npx cap add android
      - name: Sincronizar recursos Android
        run: npx cap sync android
      - name: Configurar ML Kit
        run: python3 native/android/configure_android.py
      - name: Compilar APK de prueba
        working-directory: android
        run: bash gradlew assembleDebug --no-daemon --max-workers=2
      - name: Verificar artefacto
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK de prueba como artefacto privado de Actions
        uses: actions/upload-artifact@v4
        with:
          name: fleboreport-android-mlkit-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
