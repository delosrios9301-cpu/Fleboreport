name: Publicar FleboReport y paquete OTA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar herramientas de empaquetado y actualizador
        run: npm install --no-save --no-package-lock @capacitor/core@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - name: Ejecutar pruebas y bloquear nuevas regresiones (fallos históricos documentados)
        run: node scripts/verify-test-baseline.mjs
      - name: Preparar recursos web
        run: node scripts/prepare-android-web.mjs
      - name: Crear paquete OTA y manifiesto verificado
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p www/updates
          (cd www && zip -X -q -r ../fleboreport-ota.zip . -x 'updates/*')
          CHECKSUM="$(sha256sum fleboreport-ota.zip | cut -d' ' -f1)"
          mv fleboreport-ota.zip "www/updates/${BUILD_VERSION}.zip"
          cat > www/updates/latest.json <<EOF
          {
            "version": "${BUILD_VERSION}",
            "url": "https://delosrios9301-cpu.github.io/Fleboreport/updates/${BUILD_VERSION}.zip",
            "checksum": "${CHECKSUM}"
          }
          EOF
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar sitio estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: www
      - name: Verificar paquete Pages antes de publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # El API de artefactos puede tardar en ver una carga recién terminada.
          # El despliegue exige exactamente un paquete "github-pages".
          for intento in $(seq 1 12); do
            CANTIDAD="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$CANTIDAD" = "1" ]; then
              sleep 8
              exit 0
            fi
            if [ "$CANTIDAD" -gt 1 ]; then
              echo "::error::Hay más de un artefacto Pages en esta ejecución. Se requiere una nueva ejecución limpia."
              exit 1
            fi
            sleep 5
          done
          echo "::error::GitHub todavía no reconoce el paquete del sitio."
          exit 1
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
