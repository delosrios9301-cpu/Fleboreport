name: PostgreSQL integration checks
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/postgres-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-roles:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: fleboreport_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Validate shared workspace state and roles in isolated PostgreSQL 17
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/shared-workspace-state.postgres.sql
      - name: Verify private recovery checkpoint on synthetic data
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/integrity-checkpoint.postgres.sql
      - name: Verify viewer projection does not expose clinical or patient data
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/viewer-state-isolation.postgres.sql
      - name: Verify unauthorized patient removals are blocked by shared sync
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/shared-state-patient-guard.postgres.sql
      - name: Validate technician RLS boundaries
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/technician-scope.postgres.sql
      - name: Test atomic partial workspace updates and concurrent accounts
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/shared-state-atomic-patch.postgres.sql
      - name: Test incremental section reads and private viewer projection
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/shared-state-incremental-delta.postgres.sql
      - name: Test physical module backfill and legacy bridge
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/physical-module-tables.postgres.sql
      - name: Verify independent module RPCs, conflicts and viewer privacy
        env:
          PGPASSWORD: test-only
        run: psql -h 127.0.0.1 -U postgres -d fleboreport_test -v ON_ERROR_STOP=1 -f tests/physical-module-api.postgres.sql
