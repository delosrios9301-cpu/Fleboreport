name: Publicar TALCSYS Lab Android 2.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'android-update.json'
permissions:
  contents: write
jobs:
  publicar-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recuperar firma Android original sin crear claves nuevas
        id: firma
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_PASSWORD: ${{ secrets.ANDROID_SIGNING_BACKUP_PASSWORD }}
          FLEBO_KEYSTORE: ${{ secrets.FLEBO_ANDROID_KEYSTORE_BASE64 }}
          FLEBO_STORE_PASS: ${{ secrets.FLEBO_ANDROID_KEYSTORE_PASSWORD }}
          FLEBO_ALIAS: ${{ secrets.FLEBO_ANDROID_KEY_ALIAS }}
          FLEBO_KEY_PASS: ${{ secrets.FLEBO_ANDROID_KEY_PASSWORD }}
          LEGACY_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LEGACY_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LEGACY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LEGACY_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash native/android/signing/seleccionar_firma_original.sh
      - run: npm install --no-save --no-package-lock @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - run: node scripts/prepare-android-web.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 native/android/configure_android.py
      - name: Compilar APK firmado
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  talcsysRelease {
                      storeFile file(System.getenv("TALCSYS_KEYSTORE"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.talcsysRelease
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../TALCSYS-Lab-2.6.apk
      - name: Verificar misma firma que Android 2.5
        run: |
          set -euo pipefail
          APK="TALCSYS-Lab-2.6.apk"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/talcsys-2.6-cert.txt"
          CERT="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' "$RUNNER_TEMP/talcsys-2.6-cert.txt" | head -1 | tr 'A-F' 'a-f')"
          test -n "$CERT" && test "$CERT" = "$ORIGINAL_CERT_SHA256" || { echo "::error::Certificado distinto a TALCSYS Lab 2.5"; exit 1; }
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/talcsys-badging.txt"
          grep -F "name='com.fleboreport.app'" "$RUNNER_TEMP/talcsys-badging.txt"
          grep -F "versionCode='17'" "$RUNNER_TEMP/talcsys-badging.txt"
          grep -F "versionName='2.6'" "$RUNNER_TEMP/talcsys-badging.txt"
          echo "Certificado original y versión Android 2.6 verificados."
      - name: Publicar versión 2.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v2.6 >/dev/null 2>&1 || gh release create android-v2.6 --title 'TALCSYS Lab Android 2.6' --notes 'Actualización Android 2.6 con las correcciones recientes de Domicilios y actualización OTA.'
          gh release upload android-v2.6 TALCSYS-Lab-2.6.apk --clobber
      - name: Verificar publicación y actualizar aviso Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="TALCSYS-Lab-2.6.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v2.6/${ASSET}"
          gh release view android-v2.6 --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          curl --fail --location --silent --show-error --output /dev/null "$URL"
          SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          export URL SHA
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("android-update.json")
          data = {
              "versionCode": 17,
              "versionName": "2.6",
              "releasePage": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/android-v2.6",
              "notes": "Correcciones de Domicilios y del mecanismo de actualizaciones de TALCSYS Lab.",
              "apkUrl": os.environ["URL"],
              "sha256": os.environ["SHA"]
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar aviso Android 2.6 tras verificar APK firmado"
            git push origin HEAD:main
          fi
