name: Publicar TALCSYS Lab Android 2.6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'android-update.json'
permissions:
  contents: write
jobs:
  publicar-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar disponibilidad de firma persistente
        id: firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/talcsys-release.jks"
            echo "TALCSYS_KEYSTORE=$RUNNER_TEMP/talcsys-release.jks" >> "$GITHUB_ENV"
            echo "disponible=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponible=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan secretos de firma. Se compilará APK de diagnóstico pero no se publicará una actualización incompatible."
          fi
      - run: npm install --no-save --no-package-lock @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - run: node scripts/prepare-android-web.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 native/android/configure_android.py
      - name: Compilar APK de diagnóstico
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK de diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: TALCSYS-Lab-2.6-diagnostico-no-instalar
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Compilar APK firmado
        if: steps.firma.outputs.disponible == 'true'
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  talcsysRelease {
                      storeFile file(System.getenv("TALCSYS_KEYSTORE"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.talcsysRelease
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../TALCSYS-Lab-2.6.apk
      - name: Publicar versión 2.6
        if: steps.firma.outputs.disponible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v2.6 >/dev/null 2>&1 || gh release create android-v2.6 --title 'TALCSYS Lab Android 2.6' --notes 'Actualización Android 2.6 con las correcciones recientes de Domicilios y actualización OTA.'
          gh release upload android-v2.6 TALCSYS-Lab-2.6.apk --clobber
      - name: Verificar publicación y actualizar aviso Android
        if: steps.firma.outputs.disponible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="TALCSYS-Lab-2.6.apk"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-v2.6/${ASSET}"
          gh release view android-v2.6 --json assets --jq '.assets[].name' | grep -Fx "$ASSET"
          curl --fail --location --silent --show-error --output /dev/null "$URL"
          SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          export URL SHA
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("android-update.json")
          data = {
              "versionCode": 17,
              "versionName": "2.6",
              "releasePage": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/android-v2.6",
              "notes": "Correcciones de Domicilios y del mecanismo de actualizaciones de TALCSYS Lab.",
              "apkUrl": os.environ["URL"],
              "sha256": os.environ["SHA"]
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar aviso Android 2.6 tras verificar APK firmado"
            git push origin HEAD:main
          fi
      - name: Publicar APK de diagnóstico separado cuando falte firma
        if: steps.firma.outputs.disponible != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk TALCSYS-Lab-2.6-SOLO-INSTALACION-NUEVA.apk
          gh release view android-v2.6-diagnostico >/dev/null 2>&1 || gh release create android-v2.6-diagnostico --prerelease --title 'TALCSYS Lab 2.6 - APK diagnóstico (NO actualiza instalaciones)' --notes 'APK de diagnóstico firmado con clave de depuración temporal. NO instalar sobre la aplicación existente: la firma puede ser incompatible. Para una actualización sin perder datos, configurar ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD de la firma ORIGINAL y ejecutar la publicación firmada.'
          gh release upload android-v2.6-diagnostico TALCSYS-Lab-2.6-SOLO-INSTALACION-NUEVA.apk --clobber
          echo "::warning::APK de diagnóstico publicado por separado. No sustituye una actualización firmada compatible."
