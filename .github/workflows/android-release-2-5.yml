name: Publicar TALCSYS Lab Android 2.5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-2-5.yml'
permissions:
  contents: write
jobs:
  publicar-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar firma persistente
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS" || { echo "::error::Faltan secretos de firma Android. No se publicará APK incompatible."; exit 1; }
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/talcsys-release.jks"
          echo "TALCSYS_KEYSTORE=$RUNNER_TEMP/talcsys-release.jks" >> "$GITHUB_ENV"
      - run: npm install --no-save --no-package-lock @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - run: node scripts/prepare-android-web.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 native/android/configure_android.py
      - name: Compilar APK firmado
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  talcsysRelease {
                      storeFile file(System.getenv("TALCSYS_KEYSTORE"))
                      storePassword System.getenv("STORE_PASS")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.talcsysRelease
                  }
              }
          }
          EOF
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../TALCSYS-Lab-2.5.apk
      - name: Publicar versión 2.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v2.5 >/dev/null 2>&1 || gh release create android-v2.5 --title 'TALCSYS Lab Android 2.5' --notes 'Actualización Android 2.5 con las correcciones recientes de Domicilios y actualización OTA.'
          gh release upload android-v2.5 TALCSYS-Lab-2.5.apk --clobber
