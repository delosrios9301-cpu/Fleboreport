name: Build FleboReport Android APK

on:
  push:
    branches:
      - android/fleboreport-apk-20261109
  pull_request:
    paths:
      - 'capacitor.config.json'
      - 'scripts/prepare-android-web.mjs'
      - '.github/workflows/android-apk.yml'
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'
      - 'manifest.webmanifest'
      - 'icons/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar Capacitor
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Preparar recursos web
        run: node scripts/prepare-android-web.mjs
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Sincronizar recursos Android
        run: npx cap sync android
      - name: Compilar APK de depuración instalable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Verificar APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          file android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FleboReport-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
