name: Quality checks
on:
  push:
    branches: [main, rebuild/firebase-clean-2026-11-09]
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install OTA build dependencies
        run: npm install --no-save --no-package-lock @capacitor/core@7.4.3 @capgo/capacitor-updater@7.51.15 esbuild@0.25.5
      - name: Run source tests
        run: node --test
      - name: Verify OTA bootstrap syntax
        run: node --check scripts/ota-bootstrap.mjs
      - name: Build Android web bundle
        run: node scripts/prepare-android-web.mjs
      - name: Verify OTA bootstrap is included
        run: |
          test -s www/ota-bootstrap.js
          grep -q 'ota-bootstrap.js' www/index.html
